<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 实时库存盘点系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-mark">库</div>
    <p class="page-kicker">库存管理平台</p>
    <h1>登录系统</h1>
    <p class="auth-intro">请输入您的账户信息以继续。</p>
    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>用户名<input name="username" autocomplete="username" required autofocus></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
    </form>
  </main>
</body>
</html>
