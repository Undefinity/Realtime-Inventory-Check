<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时库存盘点系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="实时库存盘点系统首页">
        <span class="brand-mark">库</span>
        <span>实时库存盘点系统<small>库存管理平台</small></span>
      </a>
      <nav class="side-nav" aria-label="功能导航">
        <button class="nav-item active" data-panel="lookup-panel"><span>⌕</span>商品查询</button>
        <button class="nav-item" data-panel="expiry-panel"><span>◷</span>临期商品</button>
        <button class="nav-item" data-panel="inventory-panel"><span>▤</span>库存总览</button>
      </nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span><span id="db-status">正在连接数据服务</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="page-kicker">库存管理</p>
          <h1 id="page-title">商品查询</h1>
          <p id="page-description">扫描条码或输入商品信息，快速查看库存情况。</p>
        </div>
        <div class="today" id="today"></div>
      </header>

      <section id="lookup-panel" class="panel active">
        <div class="search-card">
          <div class="search-heading">
            <span class="heading-icon">⌕</span>
            <div><h2>查询商品库存</h2><p>扫描枪可直接输入条码，扫描完成后自动查询。</p></div>
          </div>
          <form id="lookup-form" class="lookup-form">
            <label>商品条码
              <input id="barcode" name="barcode" autocomplete="off" placeholder="请扫描或输入商品条码" autofocus>
            </label>
            <label>门店编号 <em>选填</em>
              <input id="branch" name="branch" autocomplete="off" placeholder="不填则查询所有门店">
            </label>
            <button type="submit">查询库存</button>
          </form>
        </div>
        <div id="lookup-empty" class="empty-state"><span>▧</span><strong>等待查询</strong><p>请扫描商品条码，或手动输入条码后点击“查询库存”。</p></div>
        <div id="lookup-result" hidden></div>
      </section>

      <section id="expiry-panel" class="panel">
        <div class="tool-card">
          <div><h2>临期商品清单</h2><p>查看即将到期的商品批次，便于及时处理。</p></div>
          <div class="toolbar-actions"><label>临期天数<input id="expiry-days" type="number" min="0" max="3650" value="30"></label><button id="expiry-button" type="button">查询临期商品</button></div>
        </div>
        <div id="expiry-result" class="empty-state"><span>◷</span><strong>尚未查询</strong><p>设置临期天数后，查看对应时间范围内即将到期的商品。</p></div>
      </section>

      <section id="inventory-panel" class="panel">
        <div class="tool-card">
          <div><h2>库存总览</h2><p>查看当前有库存的全部商品；填写门店编号后可按门店筛选。</p></div>
          <button id="inventory-button" type="button">查看全部库存</button>
        </div>
        <div id="inventory-result" class="empty-state"><span>▤</span><strong>尚未查询</strong><p>点击“查看全部库存”，获取当前商品库存汇总。</p></div>
      </section>
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
